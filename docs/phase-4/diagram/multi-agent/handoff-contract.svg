<svg viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg"><style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif}.title{fill:#f8fafc;font-size:18px;font-weight:700}.subtitle{fill:#94a3b8;font-size:10px}.label{fill:#f8fafc;font-size:12px;font-weight:700}.desc{fill:#cbd5e1;font-size:9px}.tiny{fill:#94a3b8;font-size:8px}.line{fill:none;stroke:#64748b;stroke-width:1.4;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrow)}</style><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.55"/></pattern><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)" opacity=".72"/><text x="34" y="42" class="title">HandoffPacket：多 Agent 之间要传合同</text><text x="34" y="62" class="subtitle">target、task、context、required_outputs、constraints 必须显式</text>
<g><rect x="82" y="160" width="190" height="76" rx="10" fill="#0f172a"/><rect x="82" y="160" width="190" height="76" rx="10" fill="rgba(8,51,68,.42)" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/><text x="177" y="186" text-anchor="middle" class="label">Question</text><text x="177" y="206" text-anchor="middle" class="desc">用户问题 / 当前目标</text></g>
<g><rect x="338" y="132" width="304" height="138" rx="10" fill="#0f172a"/><rect x="338" y="132" width="304" height="138" rx="10" fill="rgba(120,53,15,.35)" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow)"/><text x="490" y="158" text-anchor="middle" class="label">HandoffPacket</text><text x="490" y="178" text-anchor="middle" class="desc">target + task + context + outputs + constraints</text></g>
<g><rect x="708" y="160" width="190" height="76" rx="10" fill="#0f172a"/><rect x="708" y="160" width="190" height="76" rx="10" fill="rgba(6,78,59,.42)" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/><text x="803" y="186" text-anchor="middle" class="label">Specialist</text><text x="803" y="206" text-anchor="middle" class="desc">只处理合同内的窄任务</text></g>
<path d="M272 198 L338 198" class="line"/><path d="M642 198 L708 198" class="line"/>
<text x="490" y="178" text-anchor="middle" class="desc">target: code_analyst</text><text x="490" y="198" text-anchor="middle" class="desc">required_outputs: file_refs / risks / test_gaps</text><text x="490" y="218" text-anchor="middle" class="desc">constraints: 只读分析，不执行高风险操作</text>
<rect x="144" y="346" width="692" height="86" rx="14" fill="rgba(76,29,149,.28)" stroke="#a78bfa"/><text x="490" y="378" text-anchor="middle" class="label">为什么不用一句 prompt 交接？</text><text x="490" y="404" text-anchor="middle" class="desc">自然语言交接会丢边界；结构化 handoff 让 specialist 知道要交什么、不能做什么。</text></svg>
