<svg viewBox="0 0 980 540" xmlns="http://www.w3.org/2000/svg"><style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif}.title{fill:#f8fafc;font-size:18px;font-weight:700}.subtitle{fill:#94a3b8;font-size:10px}.label{fill:#f8fafc;font-size:12px;font-weight:700}.desc{fill:#cbd5e1;font-size:9px}.tiny{fill:#94a3b8;font-size:8px}.line{fill:none;stroke:#64748b;stroke-width:1.4;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrow)}</style><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.55"/></pattern><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)" opacity=".72"/><text x="34" y="42" class="title">Reviewer Gate：答案返回前必须过证据检查</text><text x="34" y="62" class="subtitle">没有 evidence 的结论不允许直接返回用户</text>
<g><rect x="92" y="140" width="190" height="74" rx="10" fill="#0f172a"/><rect x="92" y="140" width="190" height="74" rx="10" fill="rgba(6,78,59,.42)" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/><text x="187" y="166" text-anchor="middle" class="label">Specialist Reports</text><text x="187" y="186" text-anchor="middle" class="desc">summary / evidence / risks</text></g>
<g><rect x="395" y="140" width="190" height="74" rx="10" fill="#0f172a"/><rect x="395" y="140" width="190" height="74" rx="10" fill="rgba(8,51,68,.42)" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/><text x="490" y="166" text-anchor="middle" class="label">Draft Answer</text><text x="490" y="186" text-anchor="middle" class="desc">Supervisor 汇总结论</text></g>
<g transform="translate(745,177)"><polygon points="0,-56 80,0 0,56 -80,0" fill="#0f172a"/><polygon points="0,-56 80,0 0,56 -80,0" fill="rgba(120,53,15,.36)" stroke="#fbbf24" stroke-width="1.5"/><text y="-6" text-anchor="middle" class="label">Evidence?</text><text y="14" text-anchor="middle" class="desc">有证据吗</text></g>
<g><rect x="608" y="352" width="150" height="66" rx="10" fill="#0f172a"/><rect x="608" y="352" width="150" height="66" rx="10" fill="rgba(6,78,59,.42)" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/><text x="683" y="378" text-anchor="middle" class="label">Approved</text><text x="683" y="398" text-anchor="middle" class="desc">返回用户</text></g>
<g><rect x="802" y="352" width="150" height="66" rx="10" fill="#0f172a"/><rect x="802" y="352" width="150" height="66" rx="10" fill="rgba(136,19,55,.38)" stroke="#fb7185" stroke-width="1.5" filter="url(#glow)"/><text x="877" y="378" text-anchor="middle" class="label">Needs Evidence</text><text x="877" y="398" text-anchor="middle" class="desc">退回补证据</text></g>
<path d="M282 177 L395 177" class="line"/><path d="M585 177 L665 177" class="line"/><path d="M745 233 L682 352" class="line"/><path d="M803 216 L877 352" class="line"/>
<text x="690" y="294" class="tiny" fill="#34d399">yes</text><text x="848" y="294" class="tiny" fill="#fb7185">no</text>
<rect x="132" y="462" width="716" height="34" rx="17" fill="rgba(15,23,42,.86)" stroke="#334155"/><text x="490" y="484" text-anchor="middle" class="desc">Reviewer 不负责“润色”，它负责拦住无证据、无边界、无风险说明的答案。</text></svg>
