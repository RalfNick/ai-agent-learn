<svg viewBox="0 0 980 540" xmlns="http://www.w3.org/2000/svg"><style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif}.title{fill:#f8fafc;font-size:18px;font-weight:700}.subtitle{fill:#94a3b8;font-size:10px}.label{fill:#f8fafc;font-size:12px;font-weight:700}.desc{fill:#cbd5e1;font-size:9px}.tiny{fill:#94a3b8;font-size:8px}.line{fill:none;stroke:#64748b;stroke-width:1.4;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrow)}</style><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.55"/></pattern><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)" opacity=".72"/><text x="34" y="42" class="title">Multi-Agent 不是多人聊天，而是受控分工</text><text x="34" y="62" class="subtitle">Supervisor 路由，specialist 做窄任务，reviewer 做返回前检查</text>
<g><rect x="390" y="94" width="200" height="76" rx="10" fill="#0f172a"/><rect x="390" y="94" width="200" height="76" rx="10" fill="rgba(8,51,68,.42)" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/><text x="490" y="120" text-anchor="middle" class="label">Supervisor</text><text x="490" y="140" text-anchor="middle" class="desc">plan / route / trace</text></g>
<g><rect x="90" y="242" width="190" height="70" rx="10" fill="#0f172a"/><rect x="90" y="242" width="190" height="70" rx="10" fill="rgba(6,78,59,.42)" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/><text x="185" y="268" text-anchor="middle" class="label">DocResearchAgent</text><text x="185" y="288" text-anchor="middle" class="desc">文章结构与资料证据</text></g>
<g><rect x="395" y="242" width="190" height="70" rx="10" fill="#0f172a"/><rect x="395" y="242" width="190" height="70" rx="10" fill="rgba(6,78,59,.42)" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/><text x="490" y="268" text-anchor="middle" class="label">CodeAnalysisAgent</text><text x="490" y="288" text-anchor="middle" class="desc">代码边界与测试覆盖</text></g>
<g><rect x="700" y="242" width="190" height="70" rx="10" fill="#0f172a"/><rect x="700" y="242" width="190" height="70" rx="10" fill="rgba(6,78,59,.42)" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/><text x="795" y="268" text-anchor="middle" class="label">BenchmarkAgent</text><text x="795" y="288" text-anchor="middle" class="desc">测试 / 指标 / 验收口径</text></g>
<g><rect x="390" y="402" width="200" height="70" rx="10" fill="#0f172a"/><rect x="390" y="402" width="200" height="70" rx="10" fill="rgba(136,19,55,.38)" stroke="#fb7185" stroke-width="1.5" filter="url(#glow)"/><text x="490" y="428" text-anchor="middle" class="label">ReviewerAgent</text><text x="490" y="448" text-anchor="middle" class="desc">evidence gate / risk check</text></g>
<path d="M440 170 L185 242" class="line"/><path d="M490 170 L490 242" class="line"/><path d="M540 170 L795 242" class="line"/>
<path d="M185 312 L390 430" class="dash"/><path d="M490 312 L490 402" class="dash"/><path d="M795 312 L590 430" class="dash"/>
<rect x="118" y="488" width="744" height="34" rx="17" fill="rgba(15,23,42,.86)" stroke="#334155"/><text x="490" y="510" text-anchor="middle" class="desc">核心不是让 Agent 更多，而是让每个 Agent 的输入、输出、权限和责任更窄。</text></svg>
