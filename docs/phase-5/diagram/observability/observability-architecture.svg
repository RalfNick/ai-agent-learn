<svg viewBox="0 0 1040 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { fill: #f8fafc; font-size: 18px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 10px; }
      .label { fill: #f8fafc; font-size: 12px; font-weight: 600; }
      .small { fill: #94a3b8; font-size: 9px; }
      .tiny { fill: #94a3b8; font-size: 8px; }
    </style>
  </defs>

  <rect width="1040" height="640" fill="#0f172a"/>
  <rect width="1040" height="640" fill="url(#grid)"/>

  <text x="36" y="42" class="title">Phase5 Agent Observability</text>
  <text x="36" y="62" class="subtitle">把 HTTP 请求、Agent runtime trace、工具证据、review 和成本放到同一条 trace 里</text>

  <rect x="34" y="96" width="972" height="404" rx="14" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="52" y="118" fill="#94a3b8" font-size="10" font-weight="600">FastAPI Service Boundary</text>

  <line x1="178" y1="268" x2="248" y2="268" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="268" x2="494" y2="268" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="674" y1="268" x2="748" y2="268" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 592 320 L 592 386 L 762 386" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M 870 320 L 870 386 L 762 386" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <rect x="58" y="220" width="120" height="96" rx="8" fill="#0f172a"/>
  <rect x="58" y="220" width="120" height="96" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="118" y="254" class="label" text-anchor="middle">Client</text>
  <text x="118" y="274" class="small" text-anchor="middle">curl / UI / tests</text>
  <text x="118" y="292" class="tiny" text-anchor="middle">X-Trace-Id 可传入</text>

  <rect x="248" y="204" width="172" height="128" rx="8" fill="#0f172a"/>
  <rect x="248" y="204" width="172" height="128" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="334" y="238" class="label" text-anchor="middle">HTTP Middleware</text>
  <text x="334" y="260" class="small" text-anchor="middle">normalize trace_id</text>
  <text x="334" y="278" class="small" text-anchor="middle">measure latency_ms</text>
  <text x="334" y="296" class="small" text-anchor="middle">record method/path/status</text>

  <rect x="494" y="188" width="180" height="160" rx="8" fill="#0f172a"/>
  <rect x="494" y="188" width="180" height="160" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="584" y="222" class="label" text-anchor="middle">Agent Answer Route</text>
  <text x="584" y="246" class="small" text-anchor="middle">RuntimeAdapter.answer</text>
  <text x="584" y="264" class="small" text-anchor="middle">tool_count / evidence_count</text>
  <text x="584" y="282" class="small" text-anchor="middle">review_status</text>
  <text x="584" y="300" class="small" text-anchor="middle">estimated_cost_usd</text>

  <rect x="748" y="188" width="184" height="160" rx="8" fill="#0f172a"/>
  <rect x="748" y="188" width="184" height="160" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="840" y="222" class="label" text-anchor="middle">Phase4 Runtime</text>
  <text x="840" y="246" class="small" text-anchor="middle">Memory search</text>
  <text x="840" y="264" class="small" text-anchor="middle">Supervisor handoff</text>
  <text x="840" y="282" class="small" text-anchor="middle">Project tools</text>
  <text x="840" y="300" class="small" text-anchor="middle">Reviewer</text>

  <rect x="662" y="386" width="214" height="82" rx="8" fill="#0f172a"/>
  <rect x="662" y="386" width="214" height="82" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="769" y="418" class="label" text-anchor="middle">ObservabilityStore</text>
  <text x="769" y="440" class="small" text-anchor="middle">in-memory ring buffer</text>
  <text x="769" y="456" class="tiny" text-anchor="middle">summary + trace detail</text>

  <rect x="196" y="386" width="252" height="82" rx="8" fill="#0f172a"/>
  <rect x="196" y="386" width="252" height="82" rx="8" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="322" y="418" class="label" text-anchor="middle">Query Endpoints</text>
  <text x="322" y="440" class="small" text-anchor="middle">/observability/summary</text>
  <text x="322" y="456" class="small" text-anchor="middle">/observability/traces/{trace_id}</text>

  <path d="M 662 427 L 448 427" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="62" y="530" width="916" height="70" rx="10" fill="#0f172a"/>
  <rect x="62" y="530" width="916" height="70" rx="10" fill="rgba(15,23,42,0.72)" stroke="#334155" stroke-width="1"/>
  <text x="82" y="558" fill="#f8fafc" font-size="11" font-weight="600">Trace Detail</text>
  <text x="82" y="580" class="small">trace_id → HTTP(method/path/status/latency) + Agent(question/session/tool_count/evidence_count/review/runtime_trace/cost)</text>
  <text x="82" y="594" class="tiny">学习版使用内存存储；生产版可以替换为 OpenTelemetry + Langfuse + Prometheus，不改变埋点边界。</text>
</svg>
