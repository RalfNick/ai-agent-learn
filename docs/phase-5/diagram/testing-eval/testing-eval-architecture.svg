<svg viewBox="0 0 1080 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { fill: #f8fafc; font-size: 18px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 10px; }
      .label { fill: #f8fafc; font-size: 12px; font-weight: 600; }
      .small { fill: #94a3b8; font-size: 9px; }
      .tiny { fill: #94a3b8; font-size: 8px; }
    </style>
  </defs>

  <rect width="1080" height="650" fill="#0f172a"/>
  <rect width="1080" height="650" fill="url(#grid)"/>

  <text x="36" y="42" class="title">Phase5 Testing & Eval Harness</text>
  <text x="36" y="62" class="subtitle">用固定样本 replay Agent API，不只检查 HTTP 200，还检查证据、工具、trace、review 和成本</text>

  <rect x="36" y="94" width="1008" height="420" rx="14" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="56" y="118" fill="#94a3b8" font-size="10" font-weight="600">FastAPI Evaluation Boundary</text>

  <line x1="182" y1="290" x2="260" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="290" x2="520" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="704" y1="290" x2="784" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 610 374 L 610 440 L 330 440" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M 892 374 L 892 440 L 710 440" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <rect x="62" y="224" width="120" height="132" rx="8" fill="#0f172a"/>
  <rect x="62" y="224" width="120" height="132" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="122" y="258" class="label" text-anchor="middle">Caller</text>
  <text x="122" y="282" class="small" text-anchor="middle">curl / tests</text>
  <text x="122" y="300" class="small" text-anchor="middle">run eval</text>
  <text x="122" y="318" class="tiny" text-anchor="middle">case_ids optional</text>

  <rect x="260" y="204" width="180" height="172" rx="8" fill="#0f172a"/>
  <rect x="260" y="204" width="180" height="172" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="350" y="238" class="label" text-anchor="middle">EvaluationRunner</text>
  <text x="350" y="262" class="small" text-anchor="middle">built-in cases</text>
  <text x="350" y="280" class="small" text-anchor="middle">session prefix</text>
  <text x="350" y="298" class="small" text-anchor="middle">per-case replay</text>
  <text x="350" y="316" class="small" text-anchor="middle">pass rate summary</text>

  <rect x="520" y="204" width="184" height="172" rx="8" fill="#0f172a"/>
  <rect x="520" y="204" width="184" height="172" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="612" y="238" class="label" text-anchor="middle">RuntimeAdapter</text>
  <text x="612" y="262" class="small" text-anchor="middle">same path as API</text>
  <text x="612" y="280" class="small" text-anchor="middle">Phase4 runtime</text>
  <text x="612" y="298" class="small" text-anchor="middle">tools + review</text>
  <text x="612" y="316" class="small" text-anchor="middle">structured answer</text>

  <rect x="784" y="204" width="184" height="172" rx="8" fill="#0f172a"/>
  <rect x="784" y="204" width="184" height="172" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="876" y="238" class="label" text-anchor="middle">Deterministic Judge</text>
  <text x="876" y="262" class="small" text-anchor="middle">review_status</text>
  <text x="876" y="280" class="small" text-anchor="middle">evidence threshold</text>
  <text x="876" y="298" class="small" text-anchor="middle">required tools</text>
  <text x="876" y="316" class="small" text-anchor="middle">required trace steps</text>

  <rect x="202" y="438" width="256" height="58" rx="8" fill="#0f172a"/>
  <rect x="202" y="438" width="256" height="58" rx="8" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="330" y="462" class="label" text-anchor="middle">Evaluation Response</text>
  <text x="330" y="480" class="small" text-anchor="middle">total / pass_rate / failures / cost</text>

  <rect x="604" y="438" width="212" height="58" rx="8" fill="#0f172a"/>
  <rect x="604" y="438" width="212" height="58" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="710" y="462" class="label" text-anchor="middle">ObservabilityStore</text>
  <text x="710" y="480" class="small" text-anchor="middle">eval trace detail</text>

  <rect x="70" y="546" width="940" height="70" rx="10" fill="#0f172a"/>
  <rect x="70" y="546" width="940" height="70" rx="10" fill="rgba(15,23,42,0.72)" stroke="#334155" stroke-width="1"/>
  <text x="92" y="573" fill="#f8fafc" font-size="11" font-weight="600">What gets evaluated?</text>
  <text x="92" y="594" class="small">HTTP 能返回只是第一层；Phase5 eval 还检查 runtime trace、工具调用、证据数量、review 状态、延迟和估算成本。</text>
  <text x="92" y="608" class="tiny">当前是确定性学习版；后续可替换 judge 为 LLM-as-judge、RAGAS、golden set 或线上 sampled replay。</text>
</svg>
