<svg viewBox="0 0 1060 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { fill: #f8fafc; font-size: 18px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 10px; }
      .label { fill: #f8fafc; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .desc { fill: #94a3b8; font-size: 9px; text-anchor: middle; }
      .tiny { fill: #cbd5e1; font-size: 8px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1060" height="620" fill="#0f172a"/>
  <rect width="1060" height="620" fill="url(#grid)"/>
  <text x="34" y="42" class="title">Phase5 FastAPI Runtime Wrapper</text>
  <text x="34" y="62" class="subtitle">Turning the deterministic Phase4 Agent runtime into a typed HTTP service</text>

  <rect x="48" y="120" width="180" height="360" rx="14" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="66" y="142" fill="#22d3ee" font-size="10" font-weight="700">Client Layer</text>
  <rect x="78" y="210" width="120" height="70" rx="7" fill="#0f172a"/>
  <rect x="78" y="210" width="120" height="70" rx="7" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="138" y="238" class="label">Client</text>
  <text x="138" y="256" class="desc">curl / UI / test</text>

  <rect x="288" y="120" width="250" height="360" rx="14" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="306" y="142" fill="#34d399" font-size="10" font-weight="700">FastAPI Boundary</text>
  <rect x="333" y="172" width="160" height="62" rx="7" fill="#0f172a"/>
  <rect x="333" y="172" width="160" height="62" rx="7" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.5"/>
  <text x="413" y="198" class="label">app.main</text>
  <text x="413" y="216" class="desc">routes + app factory</text>
  <rect x="333" y="270" width="160" height="62" rx="7" fill="#0f172a"/>
  <rect x="333" y="270" width="160" height="62" rx="7" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.5"/>
  <text x="413" y="296" class="label">schemas.py</text>
  <text x="413" y="314" class="desc">Pydantic request/response</text>
  <rect x="333" y="368" width="160" height="62" rx="7" fill="#0f172a"/>
  <rect x="333" y="368" width="160" height="62" rx="7" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.5"/>
  <text x="413" y="394" class="label">RuntimeAdapter</text>
  <text x="413" y="412" class="desc">dataclass -> JSON</text>

  <rect x="600" y="120" width="250" height="360" rx="14" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="618" y="142" fill="#a78bfa" font-size="10" font-weight="700">Phase4 Runtime</text>
  <rect x="645" y="172" width="160" height="62" rx="7" fill="#0f172a"/>
  <rect x="645" y="172" width="160" height="62" rx="7" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="725" y="198" class="label">Memory</text>
  <text x="725" y="216" class="desc">session JSON store</text>
  <rect x="645" y="270" width="160" height="62" rx="7" fill="#0f172a"/>
  <rect x="645" y="270" width="160" height="62" rx="7" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="725" y="296" class="label">Project Tools</text>
  <text x="725" y="314" class="desc">docs / code / benchmark</text>
  <rect x="645" y="368" width="160" height="62" rx="7" fill="#0f172a"/>
  <rect x="645" y="368" width="160" height="62" rx="7" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="725" y="394" class="label">Reviewer</text>
  <text x="725" y="412" class="desc">evidence gate</text>

  <rect x="905" y="205" width="115" height="180" rx="14" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="924" y="227" fill="#60a5fa" font-size="10" font-weight="700">Response</text>
  <rect x="925" y="270" width="75" height="62" rx="7" fill="#0f172a"/>
  <rect x="925" y="270" width="75" height="62" rx="7" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="963" y="296" class="label">JSON</text>
  <text x="963" y="314" class="desc">answer+trace</text>

  <path d="M198 245 L333 203" fill="none" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <text x="260" y="214" class="tiny">POST /answer</text>
  <path d="M413 234 L413 270" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M413 332 L413 368" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M493 399 L645 301" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="568" y="340" class="tiny">call runtime</text>
  <path d="M805 301 L925 301" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="865" y="292" class="tiny">response model</text>
