<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="av" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
    <marker id="ac" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <linearGradient id="goff" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0.15"/></linearGradient>
    <linearGradient id="gon" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#34d399" stop-opacity="0.15"/><stop offset="100%" stop-color="#60a5fa" stop-opacity="0.15"/></linearGradient>
  </defs>
  <style>text{font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif}</style>
  <rect width="1280" height="520" fill="#0f172a"/><rect width="1280" height="520" fill="url(#g)"/>
  <text x="30" y="28" fill="white" font-size="15" font-weight="700">RAG 核心流程</text>

  <rect x="30" y="48" width="1220" height="195" rx="10" fill="url(#goff)" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="50" y="70" fill="#22d3ee" font-size="11" font-weight="600">离线阶段 (Indexing) - 只做一次</text>

  <line x1="205" y1="128" x2="255" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="440" y1="128" x2="490" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="665" y1="128" x2="715" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="890" y1="128" x2="940" y2="128" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="50" y="98" width="155" height="60" rx="6" fill="#0f172a"/><rect x="50" y="98" width="155" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="127" y="122" fill="white" font-size="11" font-weight="600" text-anchor="middle">原始文档</text><text x="127" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">PDF / 网页 / Word</text>
  <rect x="260" y="98" width="180" height="60" rx="6" fill="#0f172a"/><rect x="260" y="98" width="180" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="350" y="122" fill="white" font-size="11" font-weight="600" text-anchor="middle">文本提取与清洗</text><text x="350" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">去噪 / 格式转换</text>
  <rect x="495" y="98" width="170" height="60" rx="6" fill="#0f172a"/><rect x="495" y="98" width="170" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="580" y="122" fill="white" font-size="11" font-weight="600" text-anchor="middle">切块 (Chunking)</text><text x="580" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">200-500 字符 / 块</text>
  <rect x="720" y="98" width="170" height="60" rx="6" fill="#0f172a"/><rect x="720" y="98" width="170" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="805" y="122" fill="white" font-size="11" font-weight="600" text-anchor="middle">Embedding 向量化</text><text x="805" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">文本 -&gt; 向量</text>
  <rect x="945" y="98" width="170" height="60" rx="6" fill="#0f172a"/><rect x="945" y="98" width="170" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1030" y="122" fill="white" font-size="11" font-weight="600" text-anchor="middle">向量数据库</text><text x="1030" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">存储 + 索引</text>

  <path d="M 640 243 L 640 256" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="584" y="233" width="112" height="20" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="640" y="247" fill="#94a3b8" font-size="9" font-weight="500" text-anchor="middle">索引就绪</text>
  <path d="M 640 256 L 640 268" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="30" y="275" width="1220" height="215" rx="10" fill="url(#gon)" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="50" y="298" fill="#34d399" font-size="11" font-weight="600">在线阶段 (Querying) - 每次提问都走</text>

  <line x1="195" y1="370" x2="235" y2="370" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="395" y1="370" x2="435" y2="370" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="585" y1="370" x2="625" y2="370" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="785" y1="370" x2="825" y2="370" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="985" y1="370" x2="1025" y2="370" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#ac)"/>

  <rect x="55" y="340" width="140" height="60" rx="6" fill="#0f172a"/><rect x="55" y="340" width="140" height="60" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="125" y="364" fill="white" font-size="11" font-weight="600" text-anchor="middle">用户问题</text><text x="125" y="384" fill="#94a3b8" font-size="9" text-anchor="middle">自然语言输入</text>
  <rect x="240" y="340" width="155" height="60" rx="6" fill="#0f172a"/><rect x="240" y="340" width="155" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="317" y="364" fill="white" font-size="11" font-weight="600" text-anchor="middle">Embedding 编码</text><text x="317" y="384" fill="#94a3b8" font-size="9" text-anchor="middle">问题 -&gt; 向量</text>
  <rect x="440" y="340" width="145" height="60" rx="6" fill="#0f172a"/><rect x="440" y="340" width="145" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="512" y="364" fill="white" font-size="11" font-weight="600" text-anchor="middle">相似度检索</text><text x="512" y="384" fill="#94a3b8" font-size="9" text-anchor="middle">ANN 最近邻搜索</text>
  <rect x="630" y="340" width="155" height="60" rx="6" fill="#0f172a"/><rect x="630" y="340" width="155" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="707" y="364" fill="white" font-size="11" font-weight="600" text-anchor="middle">Top-K 文档块</text><text x="707" y="384" fill="#94a3b8" font-size="9" text-anchor="middle">K 个最相关片段</text>
  <rect x="830" y="340" width="155" height="60" rx="6" fill="#0f172a"/><rect x="830" y="340" width="155" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="907" y="364" fill="white" font-size="11" font-weight="600" text-anchor="middle">Prompt 组装</text><text x="907" y="384" fill="#94a3b8" font-size="9" text-anchor="middle">问题 + 文档块</text>
  <rect x="1030" y="340" width="155" height="60" rx="6" fill="#0f172a"/><rect x="1030" y="340" width="155" height="60" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="2"/>
  <text x="1107" y="364" fill="white" font-size="11" font-weight="600" text-anchor="middle">LLM 生成回答</text><text x="1107" y="384" fill="#94a3b8" font-size="9" text-anchor="middle">基于文档内容</text>

  <path d="M 1110 404 L 1110 420 Q 1110 435 1095 435 L 195 435 Q 180 435 180 420 L 180 404" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.6"/>
  <text x="645" y="430" fill="#64748b" font-size="8" text-anchor="middle">持续优化检索质量</text>
</svg>
