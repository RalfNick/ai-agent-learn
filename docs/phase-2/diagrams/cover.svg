<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1410 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0c1a2e"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="line1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>text{font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif}</style>

  <!-- Background -->
  <rect width="1410" height="600" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.08">
    <line x1="0" y1="0" x2="1410" y2="0" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="1410" y2="40" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="1410" y2="80" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1410" y2="120" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1410" y2="160" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1410" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1410" y2="240" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="1410" y2="280" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="1410" y2="320" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="1410" y2="360" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1410" y2="400" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="440" x2="1410" y2="440" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="480" x2="1410" y2="480" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="520" x2="1410" y2="520" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="560" x2="1410" y2="560" stroke="#fff" stroke-width="0.5"/>

    <line x1="0" y1="0" x2="0" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="560" y1="0" x2="560" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="880" y1="0" x2="880" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="960" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="1040" y1="0" x2="1040" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="1120" y1="0" x2="1120" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="1200" y1="0" x2="1200" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="1280" y1="0" x2="1280" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="1360" y1="0" x2="1360" y2="600" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Decorative accent line top -->
  <rect x="0" y="0" width="1410" height="3" fill="url(#accent)"/>

  <!-- Decorative gradient lines -->
  <rect x="200" y="200" width="4" height="80" rx="2" fill="url(#line1)" opacity="0.6"/>
  <rect x="1100" y="350" width="3" height="60" rx="2" fill="url(#line2)" opacity="0.5"/>

  <!-- Main Title -->
  <text x="705" y="230" fill="white" font-size="42" font-weight="700" text-anchor="middle" letter-spacing="3">RAG 全景入门</text>

  <!-- Accent bar under title -->
  <rect x="555" y="252" width="300" height="3" rx="2" fill="url(#accent)"/>

  <!-- Subtitle -->
  <text x="705" y="300" fill="#94a3b8" font-size="20" font-weight="500" text-anchor="middle" letter-spacing="1">从"为什么需要"到"未来往哪走"</text>

  <!-- Description line -->
  <text x="705" y="350" fill="#64748b" font-size="15" text-anchor="middle">检索增强生成技术全景 · 离线建索引 + 在线检索生成 · Naive 到 Agentic</text>

  <!-- Bottom tags -->
  <g transform="translate(705, 420)">
    <rect x="-280" y="-14" width="85" height="28" rx="14" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="0.8"/>
    <text x="-237" y="5" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">Embedding</text>

    <rect x="-175" y="-14" width="70" height="28" rx="14" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-width="0.8"/>
    <text x="-140" y="5" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">检索</text>

    <rect x="-87" y="-14" width="64" height="28" rx="14" fill="rgba(168,85,247,0.12)" stroke="#a78bfa" stroke-width="0.8"/>
    <text x="-55" y="5" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">生成</text>

    <rect x="-5" y="-14" width="70" height="28" rx="14" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="0.8"/>
    <text x="30" y="5" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">评估</text>

    <rect x="85" y="-14" width="84" height="28" rx="14" fill="rgba(96,165,250,0.12)" stroke="#60a5fa" stroke-width="0.8"/>
    <text x="127" y="5" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle">Agentic</text>

    <rect x="187" y="-14" width="70" height="28" rx="14" fill="rgba(251,113,133,0.12)" stroke="#fb7185" stroke-width="0.8"/>
    <text x="222" y="5" fill="#fb7185" font-size="11" font-weight="600" text-anchor="middle">Graph</text>
  </g>

  <!-- Series label -->
  <text x="705" y="500" fill="#475569" font-size="13" text-anchor="middle">AI Agent 系统性学习系列 · Phase 2 · 第 1 篇</text>

  <!-- Bottom bar -->
  <rect x="0" y="597" width="1410" height="3" fill="url(#accent)" opacity="0.4"/>
</svg>
