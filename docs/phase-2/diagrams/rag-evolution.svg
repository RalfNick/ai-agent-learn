<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
  </defs>
  <style>text{font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif}</style>
  <rect width="1200" height="340" fill="#0f172a"/><rect width="1200" height="340" fill="url(#g)"/>
  <text x="30" y="28" fill="white" font-size="15" font-weight="700">RAG 技术演进路径</text>

  <rect x="30" y="60" width="220" height="210" rx="8" fill="rgba(139,92,246,0.08)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,3"/>
  <rect x="60" y="80" width="160" height="50" rx="25" fill="#0f172a"/><rect x="60" y="80" width="160" height="50" rx="25" fill="rgba(139,92,246,0.3)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="140" y="109" fill="white" font-size="12" font-weight="700" text-anchor="middle">Naive RAG</text><text x="140" y="145" fill="#94a3b8" font-size="9" text-anchor="middle">2020 - 2022</text>
  <text x="140" y="165" fill="#94a3b8" font-size="8" text-anchor="middle">检索 - 拼接 - 生成</text><text x="140" y="185" fill="#a78bfa" font-size="8" text-anchor="middle">能跑但粗糙</text>
  <text x="140" y="220" fill="#64748b" font-size="7" text-anchor="middle">幻觉 / 检索精度低</text><text x="140" y="235" fill="#64748b" font-size="7" text-anchor="middle">复杂问题无力</text>

  <line x1="250" y1="145" x2="310" y2="145" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ap)"/><text x="280" y="138" fill="#a78bfa" font-size="7" text-anchor="middle">逐个优化</text>

  <rect x="320" y="60" width="240" height="210" rx="8" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="1" stroke-dasharray="6,3"/>
  <rect x="350" y="80" width="180" height="50" rx="25" fill="#0f172a"/><rect x="350" y="80" width="180" height="50" rx="25" fill="rgba(52,211,153,0.3)" stroke="#34d399" stroke-width="1.5"/>
  <text x="440" y="109" fill="white" font-size="12" font-weight="700" text-anchor="middle">Advanced RAG</text><text x="440" y="145" fill="#94a3b8" font-size="9" text-anchor="middle">2022 - 2023</text>
  <text x="440" y="162" fill="#64748b" font-size="8" text-anchor="middle">检索前优化：HyDE / 查询改写</text>
  <text x="440" y="178" fill="#64748b" font-size="8" text-anchor="middle">检索中优化：混合检索 / BM25</text>
  <text x="440" y="194" fill="#64748b" font-size="8" text-anchor="middle">检索后优化：重排序 / 压缩</text>
  <text x="440" y="220" fill="#34d399" font-size="8" text-anchor="middle">每个环节精细优化</text>

  <line x1="560" y1="145" x2="620" y2="145" stroke="#34d399" stroke-width="1.5" marker-end="url(#a)"/><text x="590" y="138" fill="#34d399" font-size="7" text-anchor="middle">模块化</text>

  <rect x="630" y="60" width="240" height="210" rx="8" fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="6,3"/>
  <rect x="660" y="80" width="180" height="50" rx="25" fill="#0f172a"/><rect x="660" y="80" width="180" height="50" rx="25" fill="rgba(34,211,238,0.3)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="750" y="109" fill="white" font-size="12" font-weight="700" text-anchor="middle">Modular RAG</text><text x="750" y="145" fill="#94a3b8" font-size="9" text-anchor="middle">2023 - 2024</text>
  <text x="750" y="162" fill="#64748b" font-size="8" text-anchor="middle">搜索 / 记忆 / 路由模块</text>
  <text x="750" y="178" fill="#64748b" font-size="8" text-anchor="middle">验证 / 额外生成模块</text>
  <text x="750" y="194" fill="#64748b" font-size="8" text-anchor="middle">可自由编排组合</text>
  <text x="750" y="220" fill="#22d3ee" font-size="8" text-anchor="middle">自助餐式架构</text>

  <line x1="870" y1="145" x2="930" y2="145" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a)"/><text x="900" y="138" fill="#22d3ee" font-size="7" text-anchor="middle">Agent 化</text>

  <rect x="940" y="60" width="220" height="210" rx="8" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6,3"/>
  <rect x="970" y="80" width="160" height="50" rx="25" fill="#0f172a"/><rect x="970" y="80" width="160" height="50" rx="25" fill="rgba(251,191,36,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1050" y="109" fill="white" font-size="12" font-weight="700" text-anchor="middle">Agentic RAG</text><text x="1050" y="145" fill="#94a3b8" font-size="9" text-anchor="middle">2024 - 未来</text>
  <text x="1050" y="165" fill="#94a3b8" font-size="8" text-anchor="middle">Agent 自主判断</text>
  <text x="1050" y="185" fill="#94a3b8" font-size="8" text-anchor="middle">多轮迭代 / 工具集成</text>
  <text x="1050" y="205" fill="#94a3b8" font-size="8" text-anchor="middle">自适应检索策略</text>
  <text x="1050" y="230" fill="#fbbf24" font-size="8" text-anchor="middle">自主决策 / 持续学习</text>

  <rect x="30" y="290" width="1130" height="30" rx="6" fill="#1e293b"/>
  <text x="595" y="310" fill="#64748b" font-size="9" text-anchor="middle">能力演进：简单检索 - 精细优化 - 模块化编排 - 自主智能体</text>
