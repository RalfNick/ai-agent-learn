<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
  </defs>
  <style>text{font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif}</style>
  <rect width="1100" height="360" fill="#0f172a"/><rect width="1100" height="360" fill="url(#g)"/>
  <text x="30" y="28" fill="white" font-size="15" font-weight="700">两阶段检索架构</text>

  <text x="55" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">海量文档</text><text x="55" y="122" fill="#64748b" font-size="8" text-anchor="middle">10000+</text>

  <rect x="90" y="55" width="440" height="250" rx="10" fill="rgba(34,211,238,0.06)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="310" y="78" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">Stage 1: 粗检索 (毫秒级)</text>

  <rect x="110" y="100" width="185" height="55" rx="6" fill="#0f172a"/><rect x="110" y="100" width="185" height="55" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="202" y="123" fill="white" font-size="11" font-weight="600" text-anchor="middle">BM25 稀疏检索</text><text x="202" y="141" fill="#94a3b8" font-size="8" text-anchor="middle">关键词精确匹配</text>
  <rect x="325" y="100" width="185" height="55" rx="6" fill="#0f172a"/><rect x="325" y="100" width="185" height="55" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="417" y="123" fill="white" font-size="11" font-weight="600" text-anchor="middle">稠密向量检索</text><text x="417" y="141" fill="#94a3b8" font-size="8" text-anchor="middle">语义相似度匹配</text>

  <rect x="200" y="175" width="220" height="35" rx="6" fill="#0f172a"/><rect x="200" y="175" width="220" height="35" rx="6" fill="rgba(251,146,60,0.2)" stroke="#fb923c" stroke-width="1"/>
  <text x="310" y="197" fill="#fb923c" font-size="10" font-weight="600" text-anchor="middle">RRF 排名融合</text>

  <path d="M 202 155 L 202 175" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#a)"/>
  <path d="M 417 155 L 417 175" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#a)"/>
  <path d="M 202 210 L 202 225 L 310 225 L 310 255" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#a)"/>
  <path d="M 417 210 L 417 225 L 310 225" fill="none" stroke="#64748b" stroke-width="1"/>

  <rect x="225" y="255" width="170" height="40" rx="6" fill="#0f172a"/><rect x="225" y="255" width="170" height="40" rx="6" fill="rgba(34,211,238,0.3)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="310" y="280" fill="white" font-size="10" font-weight="600" text-anchor="middle">20 个候选文档</text>

  <path d="M 530 180 L 580 180" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#a)"/>
  <text x="555" y="173" fill="#fbbf24" font-size="8" font-weight="600" text-anchor="middle">筛选</text>

  <rect x="590" y="55" width="480" height="250" rx="10" fill="rgba(168,85,247,0.06)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="830" y="78" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">Stage 2: 精排 (百毫秒级)</text>

  <rect x="620" y="100" width="200" height="50" rx="6" fill="#0f172a"/><rect x="620" y="100" width="200" height="50" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="720" y="122" fill="white" font-size="11" font-weight="600" text-anchor="middle">Cross-Encoder 打分</text><text x="720" y="140" fill="#94a3b8" font-size="8" text-anchor="middle">查询+文档联合编码</text>

  <line x1="820" y1="125" x2="870" y2="125" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="720" y1="155" x2="720" y2="175" stroke="#64748b" stroke-width="1" marker-end="url(#a)"/>

  <rect x="620" y="180" width="400" height="55" rx="6" fill="#0f172a"/><rect x="620" y="180" width="400" height="55" rx="6" fill="rgba(59,130,246,0.2)" stroke="#60a5fa" stroke-width="2"/>
  <text x="820" y="205" fill="white" font-size="12" font-weight="700" text-anchor="middle">Top 3 最相关文档 - 送入 LLM</text><text x="820" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">高精度 / 细粒度 / 可解释</text>

  <rect x="110" y="320" width="880" height="28" rx="6" fill="#1e293b"/>
  <text x="550" y="339" fill="#64748b" font-size="9" text-anchor="middle">核心洞察: Bi-Encoder 可预计算缓存 (快) - Cross-Encoder 联合打分 (准) - 少量精选送 LLM</text>
</svg>
