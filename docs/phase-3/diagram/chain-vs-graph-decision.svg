<svg viewBox="0 0 920 600" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { fill: #f8fafc; font-size: 18px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 10px; }
    .node { fill: #f8fafc; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .hint { fill: #cbd5e1; font-size: 9px; text-anchor: middle; }
    .label { fill: #94a3b8; font-size: 8px; text-anchor: middle; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="920" height="600" fill="#0f172a"/>
  <rect width="920" height="600" fill="url(#grid)"/>

  <text x="40" y="44" class="title">什么时候用 Chain，什么时候用 Graph</text>
  <text x="40" y="64" class="sub">判断标准不是 API 偏好，而是流程形态和运行要求</text>

  <rect x="370" y="94" width="180" height="52" rx="24" fill="#0f172a"/>
  <rect x="370" y="94" width="180" height="52" rx="24" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="460" y="125" class="node">一个 Agent 流程</text>

  <line x1="460" y1="146" x2="460" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(460,242)">
    <polygon points="0,-46 72,0 0,46 -72,0" fill="#0f172a"/>
    <polygon points="0,-46 72,0 0,46 -72,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="-4" class="node">流程是否</text>
    <text y="13" class="node">基本线性?</text>
  </g>

  <line x1="388" y1="242" x2="250" y2="242" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="317" y="230" fill="#34d399" font-size="9" text-anchor="middle">是</text>
  <rect x="72" y="202" width="178" height="80" rx="8" fill="#0f172a"/>
  <rect x="72" y="202" width="178" height="80" rx="8" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="161" y="232" class="node">LangChain / LCEL</text>
  <text x="161" y="254" class="hint">Prompt -> Model -> Parser</text>
  <text x="161" y="272" class="hint">Retriever -> Prompt -> Answer</text>

  <line x1="532" y1="242" x2="670" y2="242" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <text x="603" y="230" fill="#fb7185" font-size="9" text-anchor="middle">否</text>
  <g transform="translate(744,242)">
    <polygon points="0,-46 72,0 0,46 -72,0" fill="#0f172a"/>
    <polygon points="0,-46 72,0 0,46 -72,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="-6" class="node">需要状态</text>
    <text y="12" class="node">和路由?</text>
  </g>

  <line x1="744" y1="288" x2="744" y2="352" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="758" y="324" fill="#34d399" font-size="9">是</text>
  <rect x="655" y="352" width="178" height="94" rx="8" fill="#0f172a"/>
  <rect x="655" y="352" width="178" height="94" rx="8" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.5"/>
  <text x="744" y="383" class="node">LangGraph</text>
  <text x="744" y="405" class="hint">State / Node / Edge</text>
  <text x="744" y="423" class="hint">循环 / 重试 / 暂停 / 恢复</text>

  <path d="M 672 242 L 585 242 L 585 380 L 655 380" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="605" y="360" class="label">分支、循环、审批</text>

  <rect x="82" y="386" width="380" height="92" rx="10" fill="#0f172a"/>
  <rect x="82" y="386" width="380" height="92" rx="10" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="272" y="418" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">边界不是二选一</text>
  <text x="272" y="443" fill="#cbd5e1" font-size="10" text-anchor="middle">LangChain 组件经常作为 LangGraph 节点内部能力</text>
  <text x="272" y="462" fill="#cbd5e1" font-size="10" text-anchor="middle">先组合能力，再编排执行路径</text>
</svg>
