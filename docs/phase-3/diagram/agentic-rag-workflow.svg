<svg viewBox="0 0 1120 620" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { fill: #f8fafc; font-size: 18px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 10px; }
    .node { fill: #f8fafc; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .hint { fill: #cbd5e1; font-size: 9px; text-anchor: middle; }
    .label { fill: #94a3b8; font-size: 8px; text-anchor: middle; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="1120" height="620" fill="#0f172a"/>
  <rect width="1120" height="620" fill="url(#grid)"/>

  <text x="40" y="44" class="title">Agentic RAG 为什么天然是 Graph</text>
  <text x="40" y="64" class="sub">它不是 retrieve -> answer，而是一组带质量门禁的状态转移</text>

  <path d="M 158 260 L 238 260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 398 260 L 478 260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 620 260 L 700 260" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 842 260 L 922 260" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="42" y="222" width="116" height="76" rx="8" fill="#0f172a"/>
  <rect x="42" y="222" width="116" height="76" rx="8" fill="rgba(59,130,246,0.32)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="100" y="252" class="node">用户问题</text>
  <text x="100" y="274" class="hint">question</text>

  <rect x="238" y="222" width="160" height="76" rx="8" fill="#0f172a"/>
  <rect x="238" y="222" width="160" height="76" rx="8" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="318" y="249" class="node">query_analysis</text>
  <text x="318" y="271" class="hint">意图 / 类型 / 关键词</text>

  <rect x="478" y="222" width="142" height="76" rx="8" fill="#0f172a"/>
  <rect x="478" y="222" width="142" height="76" rx="8" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.5"/>
  <text x="549" y="249" class="node">retrieve</text>
  <text x="549" y="271" class="hint">hybrid / rerank</text>

  <g transform="translate(760,260)">
    <polygon points="0,-48 82,0 0,48 -82,0" fill="#0f172a"/>
    <polygon points="0,-48 82,0 0,48 -82,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="-6" class="node">context</text>
    <text y="12" class="node">足够吗?</text>
  </g>

  <rect x="922" y="222" width="142" height="76" rx="8" fill="#0f172a"/>
  <rect x="922" y="222" width="142" height="76" rx="8" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="993" y="249" class="node">generate</text>
  <text x="993" y="271" class="hint">基于证据生成</text>

  <path d="M 760 308 L 760 404 L 548 404 L 548 298" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <text x="676" y="392" fill="#fb7185" font-size="9" text-anchor="middle">不够：rewrite 后重检索</text>
  <rect x="430" y="374" width="136" height="60" rx="8" fill="#0f172a"/>
  <rect x="430" y="374" width="136" height="60" rx="8" fill="rgba(136,19,55,0.38)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="498" y="399" class="node">rewrite</text>
  <text x="498" y="417" class="hint">改写查询</text>

  <path d="M 993 298 L 993 352" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(993,404)">
    <polygon points="0,-48 82,0 0,48 -82,0" fill="#0f172a"/>
    <polygon points="0,-48 82,0 0,48 -82,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="-6" class="node">faithful</text>
    <text y="12" class="node">吗?</text>
  </g>

  <path d="M 911 404 L 790 404 L 790 500 L 888 500" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <text x="844" y="390" fill="#fb7185" font-size="9" text-anchor="middle">否：修复</text>
  <rect x="888" y="466" width="132" height="68" rx="8" fill="#0f172a"/>
  <rect x="888" y="466" width="132" height="68" rx="8" fill="rgba(136,19,55,0.38)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="954" y="494" class="node">repair</text>
  <text x="954" y="514" class="hint">重写答案或拒答</text>
  <path d="M 954 466 L 954 452" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrow-rose)"/>

  <path d="M 1075 404 L 1090 404 L 1090 556 L 758 556 L 758 520" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1090" y="392" fill="#34d399" font-size="9" text-anchor="end">是</text>
  <rect x="674" y="466" width="168" height="68" rx="8" fill="#0f172a"/>
  <rect x="674" y="466" width="168" height="68" rx="8" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="758" y="494" class="node">final / abstain</text>
  <text x="758" y="514" class="hint">回答或明确拒答</text>

  <rect x="58" y="460" width="252" height="74" rx="10" fill="#0f172a"/>
  <rect x="58" y="460" width="252" height="74" rx="10" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="184" y="489" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">State 里应该保存什么</text>
  <text x="184" y="512" fill="#cbd5e1" font-size="10" text-anchor="middle">query / docs / grades / answer / trace</text>
</svg>
