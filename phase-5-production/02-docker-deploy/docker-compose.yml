services:
  phase5-agent-api:
    build:
      context: ../..
      dockerfile: phase-5-production/02-docker-deploy/Dockerfile
    image: ai-agent-learn/phase5-agent-api:local
    container_name: phase5-agent-api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - phase5_agent_memory:/app/phase-5-production/01-fastapi-backend/.memory
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  phase5_agent_memory:
